name: Xbox SOH Builder

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag Name'
        required: true
        default: 'v1.0.0'
      package_name:
        description: 'Package Name'
        required: true
        default: 'Xbox_SOH'

jobs:
  build:
    runs-on: windows-2022

    env:
      Platform: x64
      Configuration: Release
      BuildMode: SideLoadOnly
      AppxBundle: Never
      CMakeGenerator: "Visual Studio 17 2022"
      CMakeToolchain: "${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake"
      SourceDir: "${{ github.workspace }}/soh-uwp"
      BuildDir: "${{ github.workspace }}/build"
      PackageOutputRootDir: "${{ github.workspace }}/AppPackages"
      PackageOutputDir: "${{ github.workspace }}/AppPackages/${{ github.event.inputs.package_name }}_${{ github.event.inputs.tag_name }}"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1

      - name: Install CMake & Ninja
        uses: lukka/get-cmake@latest

      - name: Install vcpkg Dependencies
        run: |
          vcpkg integrate install
        shell: pwsh

      - name: Configure CMake
        run: |
          cmake -B "$env:BuildDir" -S "$env:SourceDir" -G "$env:CMakeGenerator" -A $env:Platform `
            -DCMAKE_TOOLCHAIN_FILE="$env:CMakeToolchain" `
            -DCMAKE_BUILD_TYPE=$env:Configuration
        shell: pwsh

      - name: Generate Self-Signed Certificate
        id: generate_cert
        run: |
          $cert = New-SelfSignedCertificate -CertStoreLocation "Cert:\CurrentUser\My" -Subject "CN=SOH_Cert" -KeyAlgorithm RSA -KeyLength 2048 -Provider "Microsoft Enhanced RSA and AES Cryptographic Provider" -KeyExportPolicy Exportable -NotAfter (Get-Date).AddYears(1) -Type CodeSigningCert
          echo "THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Build UWP App
        run: |
          msbuild "$env:BuildDir/soh-uwp.sln" `
            /p:Platform=$env:Platform `
            /p:Configuration=$env:Configuration `
            /p:UapAppxPackageBuildMode=$env:BuildMode `
            /p:AppxBundle=$env:AppxBundle `
            /p:PackageCertificateThumbprint="${{ env.THUMBPRINT }}" `
            /p:AppxPackageTestDir="$env:PackageOutputDir" `
            /p:RestorePackagesConfig=true `
            /p:AppxPackageSigningEnabled=true
        shell: pwsh    

      - name: List Package Output
        run: |
          Write-Host "Listing contents of package output directory:"
          Get-ChildItem -Path "$env:PackageOutputRootDir" -Recurse -Force
        shell: pwsh

      - name: Create Archive
        run: |
          Compress-Archive -Path "$env:PackageOutputRootDir\*" -DestinationPath "$env:PackageOutputRootDir\SOH_Archive.zip"
        shell: pwsh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SOH_Archive
          path: ${{ env.PackageOutputRootDir }}/SOH_Archive.zip
